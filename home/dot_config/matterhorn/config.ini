# Matterhorn configuration — managed by chezmoi
# Docs: https://github.com/matterhorn-chat/matterhorn/blob/master/docs/sample-config.ini
#
# No secret lives here: the password is fetched from the macOS Keychain via
# `passcmd` (create the item once — see below). Safe to commit (private repo).
# Launch from tmux with `prefix N` (display-popup), or just run `matterhorn`.

# All settings live under this required section header.
[mattermost]

# ---- Required: server connection ----
# Your Mattermost server host (NO https://, NO trailing path).
host = mattermost.example.com

# Team to open on launch (the URL slug, e.g. https://server/<team>/channels/...).
# Leave commented to be prompted for a team picker.
# team = myteam

# Port. Matterhorn uses TLS by default regardless of the port value,
# so :8065 connects over https automatically — there is no urlScheme key.
port = 8065

# ---- Authentication ----
# Username login. Password is fetched from the macOS Keychain (never stored in
# plaintext here). Create the item once:
#   security add-generic-password -s matterhorn -a user@example.com -w
user = user@example.com
passcmd = security find-generic-password -s matterhorn -a user@example.com -w

# ---- UI defaults ----
# Built-in themes: builtin:dark | builtin:light (matterhorn ships only these two;
# custom themes need a vty attribute file via themeCustomDir — not worth it here).
# Pick dark to match a dark terminal; flip to builtin:light for a light scheme.
theme = builtin:dark
showOlderEdits = True
showBackground = active
showMessageTimestamps = True
hyperlinkURLs = True

# ---- Keybinding overrides (avoid tmux / vim-tmux-navigator conflicts) ----
# tmux prefix is C-s, and christoomey/vim-tmux-navigator binds bare
# C-h/C-j/C-k/C-l for pane navigation — those keystrokes never reach matterhorn.
# Of matterhorn's defaults, only two land on stolen keys:
#   C-s -> select-mode                (eaten by the tmux prefix)
#   C-k -> editor-kill-to-end-of-line (eaten by vim-tmux-navigator pane-up)
# Alt (M-) keys are free in this tmux setup, so remap onto unused Alt combos.
# Notation matches `matterhorn -k -f markdown`.
[keybindings]
select-mode = M-v
editor-kill-to-end-of-line = M-w
