# ~/.config/containers/registries.conf — managed by chezmoi
# Make Docker-style short names resolve like Docker does: `docker run nginx`
# (→ podman) / `podman run postgres:16` pull from Docker Hub instead of failing
# short-name resolution or prompting for a registry. Short-name resolution is
# client-side, so this applies on macOS (host podman client) and Linux (native
# rootless) alike.
unqualified-search-registries = ["docker.io"]

# Resolve short names to the first search registry without an interactive prompt
# — the Docker-like, script/CI/non-TTY-safe behavior for a single-registry setup.
short-name-mode = "permissive"
