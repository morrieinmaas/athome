name: lint-test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # Reuse the repo's .pre-commit-config.yaml shellcheck hook so the args
      # (-S warning -x) and pinned version live in exactly one place. .tmpl
      # scripts are skipped automatically (the hook only matches shell files).
      - name: shellcheck (via pre-commit)
        run: pipx run pre-commit run shellcheck --all-files --show-diff-on-failure

  bats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      # test/templates.bats renders the chezmoi templates; test/ssh-nudge.bats runs
      # the ssh function under zsh.
      - name: Install chezmoi and zsh
        run: |
          sudo apt-get install -y zsh
          v=2.72.2
          sha=a2be1b8bcdf06c6f173e070bb3ddbcc52c50478fe9b57f6e6c63d15c7cff4f03
          curl -fsSLO "https://github.com/twpayne/chezmoi/releases/download/v${v}/chezmoi_${v}_linux_amd64.tar.gz"
          echo "$sha  chezmoi_${v}_linux_amd64.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "chezmoi_${v}_linux_amd64.tar.gz" -C "$HOME/.local/bin" chezmoi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run bats suite
        run: bats test
