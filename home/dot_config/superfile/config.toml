# superfile config — managed by chezmoi.
# Read via `spf -c ~/.config/superfile/config.toml` (the shell wrapper and the
# niri launcher pass -c): superfile defaults to ~/Library/Application Support on
# macOS, so -c keeps a single chezmoi-managed config at ~/.config on both OSes.
# Full field list: https://superfile.dev/configure/superfile-config/

# 'athome' is a generated theme that tracks the active `theme` pick + OS
# dark/light, so superfile follows ghostty/nvim. It's (re)written into superfile's
# data dir by ~/.config/themes/apply-superfile.sh, which the spf() shell wrapper
# and the `theme` command run before launch. (Falls back to a built-in name like
# 'gruvbox' if you ever run the bare binary before that script has generated it.)
theme = 'athome'

# Open files with nvim (renders Markdown via render-markdown.nvim + <leader>mg
# glow). superfile's open_with can't run a TTY pager like glow, so opening in
# nvim is the rendered-Markdown path.
editor = ''        # blank → $EDITOR; we export EDITOR=nvim
dir_editor = ''

auto_check_update = false

# cd the shell into the last dir on quit. With this on, ANY quit (q or Q) writes
# the dir; the `spf` shell wrapper (functions.zsh) sources it to actually cd.
cd_on_quit = true

default_open_file_preview = true
show_image_preview = true            # native kitty/ghostty graphics
show_panel_footer_info = true
default_directory = '.'
file_size_use_si = false
default_sort_type = 0
sort_order_reversed = false
case_sensitive_sort = false
shell_close_on_success = false
debug = false
ignore_missing_fields = false
page_scroll_size = 0
file_panel_extra_columns = 0
file_panel_name_percent = 50

# ================ Style =================
nerdfont = true
show_select_icons = true
transparent_background = false
file_preview_width = 0
enable_file_preview_border = false

# Syntax-highlighted file preview via bat (we install bat via mise). Markdown
# shows as highlighted source inline; press l/enter/e to open it rendered in nvim.
code_previewer = 'bat'

sidebar_width = 20
sidebar_sections = ['home', 'pinned', 'disks']

# Border style
border_top = '─'
border_bottom = '─'
border_left = '│'
border_right = '│'
border_top_left = '╭'
border_top_right = '╮'
border_bottom_left = '╰'
border_bottom_right = '╯'
border_middle_left = '├'
border_middle_right = '┤'

# ========== PLUGINS ========== #
metadata = false
enable_md5_checksum = false
# zoxide is installed via mise — `z` jumps to frecent dirs (replaces yazi's
# g h/p/w/s/d quick-jumps; pin ~/personal, ~/work, ~/sidebiz with P as well).
zoxide_support = true
