# ~/.config/gh/config.yml — managed by chezmoi
# NOTE: hosts.yml contains auth tokens and is NEVER tracked. Only the
# general gh client config lives here.
version: 1
git_protocol: ssh         # was https — switched to match our SSH-alias identity setup
telemetry: disabled       # opt out of gh's usage telemetry (default is enabled)
editor:
prompt: enabled
prefer_editor_prompt: disabled
pager:
aliases:
    co: pr checkout
    cr: pr create --web
    prv: pr view --web
http_unix_socket:
browser:
color_labels: disabled
accessible_colors: disabled
accessible_prompter: disabled
spinner: enabled
