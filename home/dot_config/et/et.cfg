; ~/.config/et/et.cfg — managed by chezmoi
; EternalTerminal (etserver) config. Single source of truth: on Linux it's
; installed to /etc/et.cfg, on macOS it's read directly by the LaunchDaemon —
; both wired up by .chezmoiscripts/run_once_18-setup-eternal-terminal.
;
; No secrets here: et does its handshake over ssh, so access is gated by sshd,
; NOT by this file. Port 2022 is reachable only over the NetBird mesh (never
; forwarded to the public internet); an attacker also needs ssh auth to get a
; shell, so the listening port alone grants nothing.
;
; Comments are on their own lines only — et's INI parser does not reliably strip
; trailing inline comments, which would otherwise become part of the value.

[Networking]
port = 2022
; bind_ip defaults to all interfaces; access is controlled by NetBird ACLs + ssh
; auth, so we leave it unset:
; bind_ip = 0.0.0.0

[Debug]
verbose = 0
silent = 0
logsize = 20971520
; opt out of et's telemetry (matches our gh / nordvpn opt-outs):
telemetry = false
logdirectory = /tmp
