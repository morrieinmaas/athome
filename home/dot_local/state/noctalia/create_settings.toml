# Noctalia v5 settings. Deployed with chezmoi's `create_` attribute, which means
# chezmoi writes this ONCE on a machine that does not have it and then never
# touches it again. That is deliberate: Noctalia rewrites this file itself from
# its own settings UI, so a normal managed file would silently discard whatever
# you changed in the shell on the next `chezmoi apply`.
#
# Path is ~/.local/state/noctalia/settings.toml (v5). v4 used
# ~/.config/noctalia/settings.json and a different schema entirely; the two
# versions can be installed side by side and share nothing.
#
# Schema: docs.noctalia.dev/noctalia/theming and /noctalia/bar

[theme]
# Palette is generated FROM THE WALLPAPER by Noctalia itself. v5 has the
# generators built in, so matugen is not involved any more (it was in v4).
# Noctalia re-resolves the palette automatically when the wallpaper changes.
source           = "wallpaper"
wallpaper_scheme = "m3-content"   # m3-tonal-spot | m3-content | m3-fruit-salad | vibrant | faithful | soft

# auto follows the system light/dark preference, which is what the rest of
# athome does (pet.sh, battery.sh, fzf-theme.sh and apply-niri.sh all detect it
# the same way), so the shell stays in step with the terminal and editor.
mode             = "auto"
shell_mode       = "follow"
pure_black_dark  = false

[bar.default]
position      = "top"
thickness     = 34
enabled       = true
reserve_space = true        # niri gets an exclusive zone so windows do not sit under the bar
layer         = "top"
padding       = 14
margin_edge   = 6
margin_ends   = 12
radius        = 12

# Capsules are the pills. Each widget gets its own rounded container rather than
# floating loose on the bar, which is the same visual language as the tmux
# status line (pill_l/pill_r around each segment).
capsule           = true
capsule_fill      = "surface_variant"
capsule_thickness = 0.76    # fraction of bar thickness
capsule_radius    = 8.0
capsule_opacity   = 1.0

background_opacity = 0.95
shadow             = true
border_width       = 0.0

start  = ["launcher", "workspaces"]
center = ["clock"]
end    = ["media", "tray", "notifications", "volume", "battery"]
