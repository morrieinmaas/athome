# ~/.config/slk/config.toml — managed by chezmoi
# slk: a fast Slack TUI (gammons/slk), installed via mise (github:gammons/slk).
#
# AUTH IS NOT STORED HERE. slk uses your browser session — run
# `slk --add-workspace`, paste your workspace's `xoxc-…` token + `d` cookie
# (DevTools), and slk writes the credentials to ~/.local/share/slk/tokens/,
# which is OUTSIDE chezmoi's tree and never tracked. On onboarding slk also
# appends a `[workspaces.<slug>]` block to THIS file — those carry no secrets
# (just slug / team_id / order). We commit exactly ONE such block on purpose —
# `[workspaces.info]` below — because `default_workspace` can only resolve to a
# committed block (see its comment). It is kept THEME-LESS so chezmoi apply still
# wipes any per-workspace `theme =` slk writes at runtime, keeping the picker-
# driven [appearance] theme authoritative across machines.

[general]
use_slack_sections = true              # mirror your real Slack sidebar sections
default_workspace  = "info"            # open INFO on launch — resolves to [workspaces.info] below

# default_workspace MUST reference a committed [workspaces.<key>] block: slk looks
# up c.Workspaces[key] and silently FALLS BACK to first-workspace-to-connect when
# the value is just a bare team id with no block (which is why "T025AMBA7" never
# worked). One theme-less block fixes it; team_id maps the slug → the real team.
[workspaces.info]
team_id = "T025AMBA7"                   # NAME "INFO" (see: slk --list-workspaces)

[appearance]
# theme is driven by the `theme` picker: ~/.config/themes/apply-slk.sh rewrites
# this line to the slk variant of the active scheme + current dark/light on every
# `prefix M` launch (see registry.sh::theme_slk). The value below is just the
# committed default (matches gruvbox-light) — change it with `theme <name>`, not
# by hand. NOTE: slk's in-app theme switcher writes a per-workspace `theme =`
# override which would beat this; chezmoi apply wipes those back out so the
# picker keeps winning.
theme          = "Gruvbox Light"
# FORCE kitty true-pixel graphics. "auto" detection is unreliable through tmux and
# silently falls back to half-block — the blocky/"pixelated" look. ghostty speaks
# the kitty graphics protocol and tmux has `allow-passthrough on` (tmux.conf), so
# skip detection and force it. NOTE: this only renders in a real pane/window — tmux
# `display-popup` can't pass graphics through, which is why `prefix M` opens slk in
# a new WINDOW, not a popup (see tmux.conf bind M).
image_protocol = "kitty"
# Image crispness with kitty = pixel footprint = cells × cell-pixel-size, so the
# caps below double as a QUALITY knob: higher caps → more cells → more pixels →
# sharper. Bounded by the actual popup pane size. (was rows=20, cols default 60.)
max_image_rows = 30                    # cap inline image HEIGHT in terminal rows
max_image_cols = 90                    # cap inline image WIDTH in terminal cols

[notifications]
enabled = true
on_dm = true
on_mention = true
