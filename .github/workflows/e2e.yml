name: e2e
on:
  push:
  pull_request:
  # Heavy (full Arch bootstrap) — also run it weekly to catch upstream drift.
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  bootstrap-arch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build e2e image
        run: docker build -f test/e2e/Dockerfile -t athome-e2e:latest .
      # GITHUB_TOKEN is auto-provided by Actions — feeds mise's GitHub backend so
      # the bootstrap never needs `gh auth login`. No Bitwarden, dummy answers.
      - name: Run bootstrap end-to-end (+ assertions)
        run: |
          docker run --rm \
            -e GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
            -e MISE_GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
            athome-e2e:latest
