# Repo-local pre-commit framework hooks. Redundant once chezmoi has
# deployed the global `core.hooksPath` hook — but useful on a fresh
# machine where chezmoi hasn't applied yet, and as a self-test in CI.
#
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
#
# Notes:
#   - gitleaks is the primary secret-leak guard
#   - shfmt + shellcheck keep shell scripts sane (we have ~16 of them)
#   - check-added-large-files mirrors the 10MB cap in the global hook
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=10240']
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: ['-i', '2', '-ci', '-bn']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ['-S', 'warning', '-x']
