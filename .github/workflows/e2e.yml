name: e2e
on:
  push:
  pull_request:
  # Heavy (full distro bootstrap) — also run it weekly to catch upstream drift.
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    # One job per distro; native amd64 runners → no emulation, full package set.
    # fail-fast off so an Arch failure doesn't cancel the Fedora run (and vice
    # versa) — each distro's result stands on its own.
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            dockerfile: test/e2e/Dockerfile
          - distro: fedora
            dockerfile: test/e2e/Dockerfile.fedora
    name: bootstrap-${{ matrix.distro }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The Arch bootstrap installs a large set at container RUN time (full GNOME
      # + niri + Noctalia + GUI apps + AUR builds + the mise tool layer) into the
      # writable layer. On the ~14 GB-free ubuntu-latest runner that tipped over
      # into "No space left on device" (2026-08-03, after upstream package growth
      # crossed the threshold). Reclaim the preinstalled toolchains this job never
      # uses (~18–20 GB) so the e2e can still install the FULL real package set.
      - name: Free up runner disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "after:"; df -h / | tail -1
      - name: Build e2e image (${{ matrix.distro }})
        run: docker build -f ${{ matrix.dockerfile }} -t athome-e2e-${{ matrix.distro }}:latest .
      # GITHUB_TOKEN is auto-provided by Actions — feeds mise's GitHub backend so
      # the bootstrap never needs `gh auth login`. No Bitwarden, dummy answers.
      - name: Run bootstrap end-to-end (+ assertions)
        run: |
          docker run --rm \
            -e GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
            -e MISE_GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
            athome-e2e-${{ matrix.distro }}:latest
