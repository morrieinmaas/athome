# athome repo tasks — run with `mise run <task>` (or `mise tasks` to list).
# mise is already the toolchain dependency, so the command wrapper lives here
# as native mise tasks instead of a separate justfile / extra tool.
#
# On a fresh checkout, `mise trust` this file once. Extra args pass through after
# the task name, e.g. `mise run teardown --all --execute`.
#
# Tasks only — no [tools] here, so this merges cleanly with the global
# ~/.config/mise/config.toml (which owns the installed toolchain).

[settings]
# Never auto-install missing tools when running a task in this repo. mise
# otherwise installs the whole toolset before a task by default — which made
# `mise run teardown` REINSTALL everything only for teardown to remove it again
# ("teardown starts installing stuff"). Tools are provisioned by bootstrap /
# explicit `mise install`, never implicitly on task-run.
auto_install = false

[tasks.bootstrap]
description = "Provision this machine (args pass through, e.g. --config bootstrap.local.toml)"
run = "./scripts/bootstrap.sh"

[tasks.bootstrap-work]
description = "Provision as a work machine"
run = "./scripts/bootstrap.sh --machine work"

[tasks.update]
description = "chezmoi update (pull + apply, the daily sync). Preview first with `mise run diff`."
run = """
chezmoi update; rc=$?
if [ "$rc" -eq 0 ]; then
  echo "✓ update complete — pulled latest and applied; machine matches the repo."
else
  echo "✗ update failed (rc=$rc) — see above." >&2; exit "$rc"
fi
"""

[tasks.apply]
description = "chezmoi apply (render source -> $HOME). Preview first with `mise run diff`."
run = """
chezmoi apply; rc=$?
if [ "$rc" -eq 0 ]; then
  echo "✓ apply complete — machine matches the repo (no output above = nothing to change)."
else
  echo "✗ apply failed (rc=$rc) — see above." >&2; exit "$rc"
fi
"""

[tasks.save]
description = "Capture live edits to managed dotfiles back into the repo source (chezmoi re-add), then show what to commit."
run = """
chezmoi re-add
echo
git -C "$(chezmoi source-path)" status --short
echo "→ review above, then commit + push (e.g. chezmoi git -- add -A && chezmoi git -- commit -m '…' && chezmoi git -- push)."
"""

[tasks.status]
description = "What's drifted on this machine vs the repo (changed files + pending scripts)."
run = """
out="$(chezmoi status)"
if [ -z "$out" ]; then
  echo "✓ in sync — no managed files differ and no scripts are pending."
else
  echo "$out"
  echo
  echo "codes: col1 = last-applied vs target · col2 = on-disk vs target"
  echo "       M=modified  A=added  D=deleted  R=chezmoi would RUN this (shell) script on apply"
  echo "note: run_before/run_after scripts run on EVERY apply by design → they always show R (not drift)."
  echo "→ content of the changes: 'mise run diff'   ·   full apply preview: 'mise run dry-run'"
fi
"""

[tasks.diff]
description = "chezmoi diff — line-level content of what apply would change."
run = "chezmoi diff"

[tasks.dry-run]
description = "Preview a full `apply` WITHOUT changing anything (managed files + which scripts would run)."
run = """
chezmoi apply --dry-run --verbose
echo
echo "↑ DRY RUN — nothing was changed."
echo "  Caveat: scripts show as 'would run', but their side-effects (package installs,"
echo "  systemd enables, etc.) are NOT previewed — only chezmoi-managed FILES are diffable."
"""

[tasks.lint]
description = "shellcheck the shell scripts (same config as CI)"
run = "pre-commit run shellcheck --all-files"

[tasks.test]
description = "run the bats test suite"
run = "bats test"

[tasks.e2e]
description = "build + run the Arch bootstrap e2e in a container (docker/podman)"
run = "./test/e2e/run.sh"

[tasks.e2e-clean]
description = "remove the Arch e2e container image + any leftover containers"
run = "./test/e2e/run.sh --clean"

[tasks.e2e-fedora]
description = "build + run the Fedora bootstrap e2e in a container (docker/podman)"
run = "ATHOME_E2E_DISTRO=fedora ./test/e2e/run.sh"

[tasks.e2e-fedora-clean]
description = "remove the Fedora e2e container image + any leftover containers"
run = "ATHOME_E2E_DISTRO=fedora ./test/e2e/run.sh --clean"

[tasks.teardown]
description = "reset for a from-scratch retry (dry-run by default; --all --execute to wipe)"
run = "./scripts/teardown.sh"
