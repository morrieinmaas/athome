# ~/.config/containers/containers.conf — managed by chezmoi
[engine]
# Compose provider for `podman compose` (and `docker compose` via the docker→podman
# shim in dot_local/bin, and anything calling `just dev`): the Go docker-compose
# client, which talks to the PODMAN socket — no Docker engine/daemon involved.
#
# We deliberately do NOT install podman-compose: 1.6.0 (current release) has
# systemic pod/dependency-lifecycle bugs — it silently removed a RUNNING postgres
# when two compose projects alternated, and `--remove-orphans` deletes ALL
# containers instead of just orphans. Podman's own default also prefers
# docker-compose ("the original Compose implementation"). See the 2026-06 podman
# migration notes.
#
# Bare name (not an absolute path) so it resolves on $PATH across machines
# (nanobrew/homebrew on macOS, pacman on Arch).
compose_providers = ["docker-compose"]
# Silence the ">>>> Executing external compose provider ..." banner on every run.
compose_warning_logs = false
