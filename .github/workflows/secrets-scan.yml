name: secrets-scan
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly resweep — catches rules added after old commits

permissions:
  contents: read
  # gitleaks-action calls GET /repos/{owner}/{repo}/pulls/{n}/commits when
  # running on pull_request events — needs pull-requests:read to succeed.
  # Without this, the action fails with HTTP 403 "Resource not accessible
  # by integration" (only on PR events; push events worked fine).
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  chezmoi-verify:
    runs-on: ubuntu-latest
    env:
      # GitHub Actions sets XDG_CONFIG_HOME on the runner, which would
      # win over our HOME redirect. Force chezmoi to look where we wrote.
      XDG_CONFIG_HOME: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Write dummy chezmoi config
        run: |
          mkdir -p "$RUNNER_TEMP/dummyhome/.config/chezmoi"
          cat > "$RUNNER_TEMP/dummyhome/.config/chezmoi/chezmoi.toml" <<'EOF'
          [data]
          machineType            = "personal"
          hostname               = "ci"
          githubHandle           = "ci-user"
          githubId               = "0"
          # CI placeholders only — real values come from chezmoi prompts at init
          # on the actual machine. Keep these synthetic so the workflow file
          # has no PII and stays committable.
          email_personal         = "ci-personal@example.invalid"
          email_work             = "ci-work@example.invalid"
          email_sidebiz          = "ci-sidebiz@example.invalid"
          name_personal          = "ci-user"
          name_work              = "ci-user"
          name_sidebiz           = "ci-user"
          netbird_management_url = ""
          nordvpn_country        = ""
          include_agents         = true
          agents_repo            = ""
          EOF

      - name: Verify chezmoi reads the config
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Repo layout: project root at $GITHUB_WORKSPACE, chezmoi source
          # nested under home/ (pointed at by .chezmoiroot). Pass --source
          # explicitly so CI doesn't depend on $PWD.
          HOME="$RUNNER_TEMP/dummyhome" \
          chezmoi --config="$RUNNER_TEMP/dummyhome/.config/chezmoi/chezmoi.toml" \
                  --source="$GITHUB_WORKSPACE/home" \
                  data | head -20

      - name: Render every .tmpl
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          # Source dir is $GITHUB_WORKSPACE/home. find is scoped there so
          # scripts/, examples/, .github/ are out of scope automatically —
          # they're not chezmoi templates.
          src="$GITHUB_WORKSPACE/home"
          cfg="$RUNNER_TEMP/dummyhome/.config/chezmoi/chezmoi.toml"

          failed=0
          while IFS= read -r f; do
            rel="${f#$src/}"
            case "$rel" in
              .chezmoi.toml.tmpl)         continue ;;  # config template, not a destination file
              encrypted_*|*/encrypted_*)  continue ;;
            esac
            if ! HOME="$RUNNER_TEMP/dummyhome" \
                 chezmoi --config="$cfg" --source="$src" \
                         execute-template < "$f" > /dev/null 2>/tmp/err; then
              echo "::error file=$rel::template render failed"
              cat /tmp/err
              failed=1
            fi
          done < <(find "$src" -name '*.tmpl' -not -path '*/.git/*')

          [[ $failed -eq 0 ]] || exit 1
          echo "✓ all templates render"
