name: go
on:
  # push runs on main only: a PR branch is tested by its pull_request run, not twice.
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request cancels its older run. Other events group by commit,
# so every main commit gets its own run instead of a queued one being dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hung package fails at go test's 5m timeout with a stack dump; packages run about
    # GOMAXPROCS at a time, so two waves fit in the job limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -timeout 5m ./...

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: assert artifacts
        run: |
          # Binary-format archives are the built binaries (dist/athome_<os>_<arch>_<variant>/athome),
          # uploaded as athome_<os>_<arch>, the names checksums.txt carries.
          test -f dist/checksums.txt
          for t in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            grep -q " athome_$t\$" dist/checksums.txt
            test -x dist/athome_${t}_*/athome
          done
          out=$(dist/athome_linux_amd64_*/athome version)
          echo "$out" | grep -q SNAPSHOT
          echo "$out" | grep -q "$(git rev-parse --short HEAD)"
