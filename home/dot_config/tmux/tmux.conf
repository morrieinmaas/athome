# ~/.config/tmux/tmux.conf — managed by chezmoi
# Requires tmux ≥ 3.2.
#
# Plugin manager: TPM (~/.config/tmux/plugins/tpm), bootstrapped via
# .chezmoiexternal.toml + a defensive `if -d` clone below.
# Plugins are installed headless by .chezmoiscripts/run_onchange_14-.

# ─── Prefix ─────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# ─── Core ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"     # truecolor passthrough
set -as terminal-features ",ghostty:RGB"
set -as terminal-features ",xterm-ghostty:RGB"      # ghostty's actual $TERM
set -g  allow-passthrough on                         # tunnel kitty graphics (slk/superfile inline images) through tmux — else they fall back to pixelated half-blocks
# superfile/helix/nvim/Claude Code use the kitty keyboard protocol. tmux only forwards
# extended keys for its OWN request method and IGNORES the kitty-protocol request
# these apps send — so `extended-keys on` (forward-on-demand) NEVER triggers and
# keys (even a bare `q` to quit a TUI) silently break in tmux. The proven fix is to
# send extended keys UNCONDITIONALLY in CSI-u format (the format the apps expect).
# Refs: roman.pt/posts/terminal-setup, yazi FAQ, ghostty discussions #8900/#9340.
# Caveat: with `always`, macOS option-as-alt can misbehave in some ghostty builds
# — if Alt/M- keys act up, that's the tradeoff. Needs a fresh client (detach +
# reattach, or `tmux kill-server`) to take effect.
set -g  extended-keys always
set -g  extended-keys-format csi-u
set -as terminal-features "xterm*:extkeys"
# Pass the real terminal through so a TUI's capability detection (image preview
# + input) works (originally from yazi's recommended tmux setup).
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g  escape-time 0                                # no esc lag — matters for nvim
set -g  history-limit 100000
set -g  mouse on
set -g  renumber-windows on
setw -g automatic-rename on                          # auto-name window after cwd basename (format below)
setw -g automatic-rename-format '#{b:pane_current_path}'  # window = current dir; a manual `prefix ,` rename sticks
set -g  allow-rename off                              # ignore programs' OSC title-sets — else the shell prompt disables auto-rename per window
setw -g main-pane-width 50%                          # main-vertical (cockpit + `prefix c`) left pane = half screen, full height
set -g  base-index 1
setw -g pane-base-index 1
set -g  set-clipboard on
set -g  focus-events on
setw -g mode-keys vi
set-option -g status-position top

# ─── Splits / windows open in current path ──────────────────────────────────
unbind '"'; unbind %
# cockpit default layout (left full-height | right top/bottom). `prefix C` = plain window.
bind c new-window -c "#{pane_current_path}" \; split-window -h -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}" \; select-layout main-vertical \; select-pane -t 1
bind C  new-window      -c "#{pane_current_path}"
bind |  split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
# reshape the CURRENT window into the cockpit layout (left full-height | right
# stack) — companion to `prefix c` (new window). Plain key because `prefix M-4`
# never arrives when the terminal doesn't forward Alt.
bind V select-layout main-vertical

# ─── Pane navigation: vim-style hjkl in addition to arrows ──────────────────
# tmux ships `prefix + arrow keys`; add `prefix + h/j/k/l` for vim muscle
# memory. christoomey/vim-tmux-navigator (loaded as a plugin below) also
# binds bare Ctrl+h/j/k/l/\ to navigate transparently between tmux panes
# AND vim splits — no prefix needed in either context.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + H/J/K/L (capital, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# ─── Reload ─────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# ─── Session cycling ────────────────────────────────────────────────────────
# prefix t        → last (most-recent) session
# prefix ( / )    → previous / next session, repeatable: hold prefix-window and
#                   tap (/) to shuffle through sessions without re-pressing C-s.
#                   tmux's built-in `(`/`)` aren't -r by default; these are.
# `-l` is the client's LAST session, which is per-client and empty on a fresh
# attach, so over SSH it just reports "no last session" until you have switched
# once. Fall back to the sessionx picker (the same thing `prefix s` opens) so
# the key always does something useful rather than dead-ending on a new client.
bind t if -F '#{client_last_session}' 'switch-client -l' \
  'run-shell "$HOME/.config/tmux/plugins/tmux-sessionx/scripts/sessionx.sh"'
bind -r ( switch-client -p
bind -r ) switch-client -n

# ─── Cockpit: bootstrap the 4 context sessions (work/personal/sidebiz/misc) ──
# Idempotent — creates only missing sessions (detached), safe alongside continuum.
bind B run-shell '$HOME/.local/bin/cockpit'

# ─── TUI launchers ──────────────────────────────────────────────────────────
# One keystroke to the GitHub, Slack + Mattermost TUIs. Most use display-popup
# (-E closes it when the app exits); slk is the exception — it opens in a window
# so kitty inline images aren't stripped by the popup overlay (see bind M).
# We call the mise shims by ABSOLUTE path on purpose: display-popup runs
# its command in the tmux *server* environment, which never sources ~/.zshenv,
# so the mise shims dir isn't on PATH there. The shim itself resolves the
# pinned version, and gh-dash still finds `gh` via the server's inherited PATH.
# gh-dash also binds `T` to spawn gh-enhance/ENHANCE in a new window — see
# ~/.config/gh-dash/config.yml.
bind g display-popup -E -w 95% -h 90% '$HOME/.config/themes/apply-ghdash.sh 2>/dev/null; exec $HOME/.local/share/mise/shims/gh-dash' # GitHub PR/issue dashboard (theme follows picker)
# gh-enhance (ENHANCE Actions TUI) REQUIRES a PR#/URL — run bare it just errors
# "No PR passed". The helper auto-resolves the CURRENT branch's PR (popup opened
# in the pane's repo dir via -d) and opens it directly; only when there's no PR
# does it prompt for a PR/run #/URL. (The other path is gh-dash's `T` on a
# selected PR — see ~/.config/gh-dash/config.yml.)
bind G display-popup -E -w 95% -h 90% -d '#{pane_current_path}' '$HOME/.config/tmux/enhance-pr.sh'
# slk — Slack (Messages). Opens in a NEW WINDOW, not a display-popup: tmux popups
# render into their own overlay buffer that strips graphics escapes (allow-passthrough
# applies to panes only), so kitty inline images degrade to pixelated half-blocks in
# a popup but render crisp in a real window. The window closes when slk exits.
# apply-slk.sh first so the theme tracks the `theme` picker + current dark/light
# (slk reads its config fresh on each launch).
bind M new-window -n slack '$HOME/.config/themes/apply-slk.sh 2>/dev/null; exec $HOME/.local/share/mise/shims/slk'
# matterhorn — Mattermost TUI. Window, not popup (same reason as slk's bind M:
# popups strip kitty graphics → pixelated inline images). Closes when it exits.
bind N new-window -n mattermost '$HOME/.local/bin/matterhorn'
# Icon picker — fzf popup to choose the status-bar icons (a daytime one + a
# nighttime one) from ~all color emoji; writes their codepoints + sampled colours
# to ~/.config/tmux/pet-glyph. Extend via pet-pick.sh / regenerate emoji.tsv.
bind P display-popup -E -b none -w 60% -h 80% '$HOME/.config/tmux/pet-pick.sh'   # prefix P → pick icons (no border)
bind T display-popup -E -b none -w 50% -h 55% 'THEME_POPUP=1 $HOME/.local/bin/theme'  # prefix T → pick a colour theme (ghostty+tmux+nvim)
bind W display-popup -E -b none -w 64 -h 24 '$HOME/.config/tmux/net-popup.sh'         # prefix W → network detail (same popup the status pills open)

# Click the network pills for detail, or `prefix W` if you prefer the keyboard.
# The status-right option wraps the whole net.sh segment in #[range=user|net]:
# tmux honours #[range=…] reliably only when it appears in the status OPTION,
# not when it arrives via a #() command's output, so the script must not emit it.
# tmux reports the name back
# as #{mouse_status_range}. The else-branch restores tmux's DEFAULT behaviour
# for this key, so clicking a window name in the status line still selects it;
# without it, binding MouseDown1Status would silently break that.
# The else branch must reproduce tmux's OWN default for this key, which with a
# two-line status is `switch-client -t =` (not select-window). Get that wrong
# and clicking anywhere else on the status line silently stops working.
# The pattern must match the range name EXACTLY as tmux reports it, which is
# "user|net", not "net". Verify any change with:
#   tmux display-message -p '#{m:<pattern>,user|net}'   # must print 1
bind -n MouseDown1Status if -F '#{m:*net*,#{mouse_status_range}}' \
  'display-popup -E -b none -w 64 -h 24 "$HOME/.config/tmux/net-popup.sh #{mouse_status_range}"' \
  'switch-client -t ='
# prefix ? — SEARCHABLE list of every keybinding (fzf popup over `list-keys`).
# Replaces tmux's default non-searchable list-keys pager; unlike which-key
# (prefix Space) it shows ALL bindings across every key-table, fuzzy-searchable.
bind ? run-shell '$HOME/.config/tmux/keys-popup.sh'                                # prefix ? → fuzzy-search all keybindings (own fzf --tmux popup)

# Status bar: hand-rolled gruvbox-light PILLS (rounded nerd-font caps), defined
# in the post-init block at the bottom of this file. No theme plugin — full
# control over the pill shape, and one less dependency. Needs a Nerd Font +
# a truecolor terminal (ghostty has both; the terminal-features RGB lines above
# enable hex colours).

# continuum auto save / restore
set -g @continuum-restore       'on'
set -g @continuum-save-interval '5'
set -g @resurrect-strategy-nvim 'session'

# Restore Claude Code panes too (resurrect only relaunches whitelisted procs).
# Resurrect replays the pane's saved command line verbatim, so a pane running
# `claude --resume <id>` comes back on the SAME conversation after a reboot.
# A pane started as bare `claude` has no id in its command line — the `claude`
# shell fn (dot_zsh/functions.zsh) mints one up front as `--session-id <uuid>`,
# and the inline strategy (`->`) rewrites it to `--resume <uuid>` on restore,
# because a session id can't be reused for a second launch.
set -g @resurrect-processes '"~claude" "~claude --session-id->claude --resume *"'

# sessionx (prefix s opens fuzzy session picker)
set -g @sessionx-bind         's'
set -g @sessionx-zoxide-mode  'on'
set -g @sessionx-window-mode  'on'

# prefix K — session picker (tsess, ~/.local/bin/tsess): live tmux sessions + the
# work/personal/sidebiz trees, entities, and git repos → attach or create. No
# plugin, no sesh — plain `fzf --tmux`. Replaced t-smart (abandoned; its $2 field
# parse rendered detached/never-attached sessions blank).
bind K run-shell '$HOME/.local/bin/tsess'

# ─── Plugins (TPM) ──────────────────────────────────────────────────────────
# Pin TPM's plugin dir to ~/.config/tmux/plugins/ — full XDG. This matches
# TPM's own default for an XDG config (~/.config/tmux/tmux.conf), so the
# override is belt-and-suspenders: it keeps the bootstrap below,
# .chezmoiexternal, and run_onchange_14 (which all install into
# ~/.config/tmux/plugins/) in lockstep regardless of TPM version.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'alexwforsythe/tmux-which-key' # prefix-Space → keybinding popup
set -g @plugin 'Ataraxy-Labs/opensessions' # sidebar for coding agents — prefix o → s
set -g @plugin 'wfxr/tmux-fzf-url'          # prefix u → fzf-pick a URL on the pane, open via `open`
set -g @plugin 'craftzdog/tmux-claude-session-manager' # prefix a launch · prefix A picker (keys set below)

# tmux-fzf-url: scan scrollback (not just the visible screen) for URLs.
set -g @fzf-url-history-limit '2000'

# tmux-claude-session-manager: list/jump across nested Claude Code sessions.
# Its defaults (y launch / u list) BOTH collide here — `y` is tmux-yank's
# copy-line and `u` is tmux-fzf-url — so remap to the free a/A pair (mnemonic
# "agent", matching the lowercase/uppercase idiom of c/C above): lowercase
# launches for the current dir, uppercase opens the picker. Needs fzf + jq +
# claude ≥ 2.1.139, all on the tmux server PATH here (mise installs dir).
set -g @claude_launch_key 'a'   # prefix a → launch/attach a Claude session for the current dir
set -g @claude_list_key   'A'   # prefix A → picker: every running agent + live status

# ─── Bootstrap TPM if missing (idempotent — chezmoi external also fetches) ──
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm \
        && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM — must be the last `set -g @plugin` line above.
run '~/.config/tmux/plugins/tpm/tpm'

# Re-assert bindings that plugins clobber at load time:
# opensessions hard-binds `prefix C-s` to sidebar-focus — use `prefix o s` for
# that, and restore send-prefix so `C-s C-s` reaches a nested tmux/app.
bind C-s send-prefix

# which-key (prefix Space): route its "+Keys ?" entry to our searchable fzf popup
# instead of the default non-searchable `list-keys -N` pager — so `prefix Space ?`
# matches `prefix ?`. Backgrounded + polling because TPM re-sources which-key
# AFTER this line and rebuilds @wk_menu_root (see wk-keys-fix.sh).
run-shell -b '$HOME/.config/tmux/wk-keys-fix.sh'

# ─── Status bar: themed pills (@theme_* · post-init so nothing overrides it) ────
# Rounded pill caps are nerd-font half-circles (U+E0B6 / U+E0B4) plus a zoom
# magnifier (U+F002), generated from codepoints into @pill_* options below — so
# NO literal multibyte glyph bytes live in this file and nothing (editor,
# formatter, AI tool) can silently strip them. Needs a Nerd Font + truecolor.
run-shell 'tmux set -g @pill_l "$(printf "\xee\x82\xb6")"; tmux set -g @pill_r "$(printf "\xee\x82\xb4")"; tmux set -g @pill_zoom "$(printf "\xef\x80\x82")"'

# Palette: canvas transparent (bg=default — the terminal shows through, so the
# pills float and follow ghostty's dark/light) · accents come from @theme_* user
# options so the `theme` picker can recolour the bar live. Defaults below are
# gruvbox-light; ~/.config/themes/apply-tmux.sh overrides them per pick.
set -g @theme_bg     "#fbf1c7"
set -g @theme_fg     "#3c3836"
set -g @theme_blue   "#458588"
set -g @theme_yellow "#b57614"
set -g @theme_green  "#79740e"
set -g @theme_grey   "#a89984"
set -g @theme_muted  "#7c6f64"
set -g @theme_red    "#cc241d"   # alert accent (prefix-armed pill); NOT recoloured by the theme picker — a fixed warning red
# 2 status rows: pills on the upper row, an empty lower row as bottom padding so
# terminal content below doesn't butt directly against the pills. For
# status-position top, line [0] is the top row (the pills, built from
# status-left/window-status/status-right) and line [1] sits beneath it.
set -g status 2
set -g status-format[1] ""
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=default,fg=#{@theme_fg}"
set -g status-left-length  100
set -g status-right-length 200

# session pill — blue normally, turns red while the prefix (C-s) is armed
# (#{client_prefix}) so you always know the prefix is "held". The accent colour
# is chosen inline in all three pill parts.
# Host pill, then session pill. The host pill exists because the status bar
# belongs to whichever machine runs the tmux SERVER: attach to a remote tmux
# (ssh -t host tmux new -A -s work) and you are looking at THAT machine's bar.
# Nest a remote session inside a local one and two bars stack with nothing
# distinguishing them, which is how you end up running something on the wrong
# box. #h is tmux's own short-hostname format, so this needs no script and no
# hardcoded name (which also keeps this repo publishable).
set -g status-left "#[fg=#{@theme_grey},bg=default]#{@pill_l}#[fg=#{@theme_bg},bg=#{@theme_grey},bold] #h #[fg=#{@theme_grey},bg=default,nobold]#{@pill_r} #[fg=#{?client_prefix,#{@theme_red},#{@theme_blue}},bg=default]#{@pill_l}#[fg=#{@theme_bg},bg=#{?client_prefix,#{@theme_red},#{@theme_blue}},bold] #S #[fg=#{?client_prefix,#{@theme_red},#{@theme_blue}},bg=default,nobold]#{@pill_r}  "

# window pills: inactive muted flat, active = amber pill (+ zoom magnifier)
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@theme_muted},bg=default] #I#{?#W, #W,} "
set -g window-status-current-format "#[fg=#{@theme_yellow},bg=default]#{@pill_l}#[fg=#{@theme_fg},bg=#{@theme_yellow},bold] #I#{?#W, #W,}#{?window_zoomed_flag, #{@pill_zoom},} #[fg=#{@theme_yellow},bg=default,nobold]#{@pill_r}"

# right: icon (~/.config/tmux/pet.sh — a light-mode glyph + a dark-mode glyph
# switched by system appearance, NO animation/status, NO pill — the emoji just
# floats on the transparent bar) + battery + date pill + clock pill. ON by
# default; hide it live with `tmux set -g @pet ''`. Pick the icons with `prefix P`.
set -g @pet 'on'
# battery segment (~/.config/tmux/battery.sh): colour-emoji (🔋 / 🪫 / ⚡️) + %
# in a blue pill, right after the icon; follows charge/charging state, self-hides
# on desktops with no battery. The pill's #[…] colours are emitted by the SCRIPT
# (so the @batt ternary stays comma-free). Toggle live: `tmux set -g @batt ''`.
set -g @batt 'on'
# network segment (~/.config/tmux/net.sh): two pills, link + VPN. The link pill
# names the Wi-Fi SSID, or the interface when wired; it asks the routing table
# for the *gateway's* interface rather than the default route, because on a
# machine with tunnels up the default route IS a tunnel. The VPN pill shows
# which of wg-quick (wg) and NetBird (nb) are up. Colours are emitted by the
# SCRIPT, same as battery.sh, so the @net ternary stays comma-free.
# Toggle live: `tmux set -g @net ''`.
set -g @net 'on'
set -g status-right "#{?@pet,#[bg=default] #(~/.config/tmux/pet.sh)  ,}#{?@net,#[bg=default]#[range=user|net]#(~/.config/tmux/net.sh)#[norange]  ,}#{?@batt,#[bg=default]#(~/.config/tmux/battery.sh)  ,}#[fg=#{@theme_grey},bg=default]#{@pill_l}#[fg=#{@theme_fg},bg=#{@theme_grey}] %a %d %b #[fg=#{@theme_grey},bg=default]#{@pill_r}  #[fg=#{@theme_green},bg=default]#{@pill_l}#[fg=#{@theme_bg},bg=#{@theme_green},bold] %H:%M #[fg=#{@theme_green},bg=default,nobold]#{@pill_r} #(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"

# Honour a theme picked in an earlier session (the `theme` command writes the
# name to ~/.config/themes/active); overrides the gruvbox-light defaults above.
if-shell '[ -r ~/.config/themes/active ]' 'run-shell "~/.config/themes/apply-tmux.sh"'
