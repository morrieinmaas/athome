# ~/.config/tmux/tmux.conf — managed by chezmoi
# Requires tmux ≥ 3.2.
#
# Plugin manager: TPM (~/.config/tmux/plugins/tpm), bootstrapped via
# .chezmoiexternal.toml + a defensive `if -d` clone below.
# Plugins are installed headless by .chezmoiscripts/run_onchange_14-.

# ─── Prefix ─────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# ─── Core ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"     # truecolor passthrough
set -as terminal-features ",ghostty:RGB"
set -as terminal-features ",xterm-ghostty:RGB"      # ghostty's actual $TERM
set -g  escape-time 0                                # no esc lag — matters for nvim
set -g  history-limit 100000
set -g  mouse on
set -g  renumber-windows on
setw -g automatic-rename on                          # auto-name window after cwd basename (format below)
setw -g automatic-rename-format '#{b:pane_current_path}'  # window = current dir; a manual `prefix ,` rename sticks
set -g  allow-rename off                              # ignore programs' OSC title-sets — else the shell prompt disables auto-rename per window
set -g  base-index 1
setw -g pane-base-index 1
set -g  set-clipboard on
set -g  focus-events on
setw -g mode-keys vi
set-option -g status-position top

# ─── Splits / windows open in current path ──────────────────────────────────
unbind '"'; unbind %
# cockpit default layout (left full-height | right top/bottom). `prefix C` = plain window.
bind c new-window -c "#{pane_current_path}" \; split-window -h -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}" \; select-layout main-vertical \; select-pane -t 1
bind C  new-window      -c "#{pane_current_path}"
bind |  split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"

# ─── Pane navigation: vim-style hjkl in addition to arrows ──────────────────
# tmux ships `prefix + arrow keys`; add `prefix + h/j/k/l` for vim muscle
# memory. christoomey/vim-tmux-navigator (loaded as a plugin below) also
# binds bare Ctrl+h/j/k/l/\ to navigate transparently between tmux panes
# AND vim splits — no prefix needed in either context.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + H/J/K/L (capital, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# ─── Reload ─────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# ─── Jump to last session ───────────────────────────────────────────────────
bind t switch-client -l

# ─── Cockpit: bootstrap the 4 context sessions (work/personal/sidebiz/misc) ──
# Idempotent — creates only missing sessions (detached), safe alongside continuum.
bind B run-shell '$HOME/.local/bin/cockpit'

# ─── TUI launchers (full-screen display-popups) ─────────────────────────────
# One keystroke to the GitHub + Slack TUIs. -E closes the popup when the app
# exits. We call the mise shims by ABSOLUTE path on purpose: display-popup runs
# its command in the tmux *server* environment, which never sources ~/.zshenv,
# so the mise shims dir isn't on PATH there. The shim itself resolves the
# pinned version, and gh-dash still finds `gh` via the server's inherited PATH.
# gh-dash also binds `T` to spawn gh-enhance/ENHANCE in a new window — see
# ~/.config/gh-dash/config.yml.
bind g display-popup -E -w 95% -h 90% '$HOME/.local/share/mise/shims/gh-dash'    # GitHub PR/issue dashboard
bind G display-popup -E -w 95% -h 90% '$HOME/.local/share/mise/shims/gh-enhance' # ENHANCE — Actions TUI
bind M display-popup -E -w 95% -h 90% '$HOME/.local/share/mise/shims/slk'        # slk — Slack (Messages)
# Icon picker — fzf popup to choose the status-bar icons (a daytime one + a
# nighttime one) from ~all color emoji; writes their codepoints + sampled colours
# to ~/.config/tmux/pet-glyph. Extend via pet-pick.sh / regenerate emoji.tsv.
bind P display-popup -E -b none -w 60% -h 80% '$HOME/.config/tmux/pet-pick.sh'   # prefix P → pick icons (no border)

# Status bar: hand-rolled gruvbox-light PILLS (rounded nerd-font caps), defined
# in the post-init block at the bottom of this file. No theme plugin — full
# control over the pill shape, and one less dependency. Needs a Nerd Font +
# a truecolor terminal (ghostty has both; the terminal-features RGB lines above
# enable hex colours).

# continuum auto save / restore
set -g @continuum-restore       'on'
set -g @continuum-save-interval '5'
set -g @resurrect-strategy-nvim 'session'

# sessionx (prefix s opens fuzzy session picker)
set -g @sessionx-bind         's'
set -g @sessionx-zoxide-mode  'on'
set -g @sessionx-window-mode  'on'

# prefix K — session picker (tsess, ~/.local/bin/tsess): live tmux sessions + the
# work/personal/sidebiz trees, entities, and git repos → attach or create. No
# plugin, no sesh — plain `fzf --tmux`. Replaced t-smart (abandoned; its $2 field
# parse rendered detached/never-attached sessions blank).
bind K run-shell '$HOME/.local/bin/tsess'

# ─── Plugins (TPM) ──────────────────────────────────────────────────────────
# Pin TPM's plugin dir to ~/.config/tmux/plugins/ — full XDG. This matches
# TPM's own default for an XDG config (~/.config/tmux/tmux.conf), so the
# override is belt-and-suspenders: it keeps the bootstrap below,
# .chezmoiexternal, and run_onchange_14 (which all install into
# ~/.config/tmux/plugins/) in lockstep regardless of TPM version.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'alexwforsythe/tmux-which-key' # prefix-Space → keybinding popup
set -g @plugin 'Ataraxy-Labs/opensessions' # sidebar for coding agents — prefix o → s
set -g @plugin 'wfxr/tmux-fzf-url'          # prefix u → fzf-pick a URL on the pane, open via `open`

# tmux-fzf-url: scan scrollback (not just the visible screen) for URLs.
set -g @fzf-url-history-limit '2000'

# ─── Bootstrap TPM if missing (idempotent — chezmoi external also fetches) ──
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm \
        && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM — must be the last `set -g @plugin` line above.
run '~/.config/tmux/plugins/tpm/tpm'

# Re-assert bindings that plugins clobber at load time:
# opensessions hard-binds `prefix C-s` to sidebar-focus — use `prefix o s` for
# that, and restore send-prefix so `C-s C-s` reaches a nested tmux/app.
bind C-s send-prefix

# ─── Status bar: everforest-light pills (post-init so nothing overrides it) ─────
# Rounded pill caps are nerd-font half-circles (U+E0B6 / U+E0B4) plus a zoom
# magnifier (U+F002), generated from codepoints into @pill_* options below — so
# NO literal multibyte glyph bytes live in this file and nothing (editor,
# formatter, AI tool) can silently strip them. Needs a Nerd Font + truecolor.
run-shell 'tmux set -g @pill_l "$(printf "\xee\x82\xb6")"; tmux set -g @pill_r "$(printf "\xee\x82\xb4")"; tmux set -g @pill_zoom "$(printf "\xef\x80\x82")"'

# Palette: canvas transparent (bg=default — the terminal shows through, so the
# pills float and follow ghostty's dark/light) · pill text-on-fill stays fixed ·
# everforest-light: blue #3a94c5 · yellow #dfa000 · green #8da101 · grey #a6b0a0 · bg #fdf6e3 · fg #5c6a72.
# 2 status rows: pills on the upper row, an empty lower row as bottom padding so
# terminal content below doesn't butt directly against the pills. For
# status-position top, line [0] is the top row (the pills, built from
# status-left/window-status/status-right) and line [1] sits beneath it.
set -g status 2
set -g status-format[1] ""
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=default,fg=#5c6a72"
set -g status-left-length  100
set -g status-right-length 200

# session pill (blue)
set -g status-left "#[fg=#3a94c5,bg=default]#{@pill_l}#[fg=#fdf6e3,bg=#3a94c5,bold] #S #[fg=#3a94c5,bg=default,nobold]#{@pill_r}  "

# window pills: inactive muted flat, active = amber pill (+ zoom magnifier)
set -g window-status-separator " "
set -g window-status-format "#[fg=#829181,bg=default] #I#{?#W, #W,} "
set -g window-status-current-format "#[fg=#dfa000,bg=default]#{@pill_l}#[fg=#5c6a72,bg=#dfa000,bold] #I#{?#W, #W,}#{?window_zoomed_flag, #{@pill_zoom},} #[fg=#dfa000,bg=default,nobold]#{@pill_r}"

# right: icon (~/.config/tmux/pet.sh — a light-mode glyph + a dark-mode glyph
# switched by system appearance, NO animation/status, NO pill — the emoji just
# floats on the transparent bar) + date pill + clock pill. ON by default; hide
# it live with `tmux set -g @pet ''`. Pick the icons with `prefix P`.
set -g @pet 'on'
set -g status-right "#{?@pet,#[bg=default] #(~/.config/tmux/pet.sh)  ,}#[fg=#a6b0a0,bg=default]#{@pill_l}#[fg=#5c6a72,bg=#a6b0a0] %a %d %b #[fg=#a6b0a0,bg=default]#{@pill_r}  #[fg=#8da101,bg=default]#{@pill_l}#[fg=#fdf6e3,bg=#8da101,bold] %H:%M #[fg=#8da101,bg=default,nobold]#{@pill_r} #(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"
